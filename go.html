<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>schnoez</title>
    <meta name="robots" content="noindex, nofollow">
    <meta name="theme-color" content="#0a0a0a">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html, body {
            height: 100%;
            background: #0a0a0a;
            color: #e5e5e5;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 16px;
        }
        .container {
            width: 100%;
            max-width: 340px;
            text-align: center;
        }

        .avatar {
            width: 88px;
            height: 88px;
            border-radius: 50%;
            object-fit: cover;
            margin-bottom: 18px;
            border: 1px solid #222;
        }

        .name {
            font-size: 20px;
            font-weight: 500;
            letter-spacing: 0.02em;
            margin-bottom: 4px;
        }

        .username {
            font-size: 13px;
            color: #777;
            margin-bottom: 32px;
        }

        .btn {
            display: block;
            width: 100%;
            padding: 15px 20px;
            background: #161616;
            color: #fff;
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            border-radius: 10px;
            border: 1px solid #2a2a2a;
            transition: background 0.2s ease, border-color 0.2s ease;
            margin-bottom: 12px;
        }
        .btn:hover {
            background: #1f1f1f;
            border-color: #3a3a3a;
        }

        .socials {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 14px 18px;
            margin-top: 28px;
        }
        .socials a {
            color: #666;
            font-size: 12px;
            text-decoration: none;
            transition: color 0.2s;
        }
        .socials a:hover {
            color: #aaa;
        }
    </style>
</head>
<body>
    <div class="container">
        <img class="avatar" src="hero.jpg" alt="schnoez">

        <div class="name">schnoez</div>
        <div class="username">@schnoez</div>

        <!-- Main link -->
        <a class="btn" href="https://onlyfans.com/schnoez">
            Continue
        </a>

        <!-- Secondary links -->
        <div class="socials">
            <a href="https://www.instagram.com/schnoez">Instagram</a>
            <a href="https://x.com/schnoezX">X</a>
            <a href="https://www.tiktok.com/@schnoezz">TikTok</a>
            <a href="https://bsky.app/profile/schnoez.bsky.social">Bluesky</a>
        </div>
    </div>
</body>
</html>
