<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>SCHNOEZ — Content Creator</title>
    <meta name="description" content="SCHNOEZ — Content Creator">
    <meta name="theme-color" content="#050505">
    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="apple-touch-icon" href="favicon.png">
    <meta property="og:title" content="SCHNOEZ">
    <meta property="og:description" content="Content Creator">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://schnoez.com">
    <style>
        *, *::before, *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: inherit;
        }
        html, body { width: 100%; height: 100%; background: #050505; }
        body {
            overflow: hidden;
            color: #fff;
            background: #050505;
            font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
        }
        .hero {
            position: relative;
            width: 100%;
            height: 100dvh;
            min-height: 100vh;
            overflow: hidden;
            background: #050505;
            isolation: isolate;
        }
        .hero::before {
            content: "";
            position: absolute;
            inset: 0;
            z-index: 0;
            background:
                radial-gradient(circle at 50% 18%, rgba(255, 245, 235, 0.18), transparent 22%),
                linear-gradient(180deg, rgba(18, 18, 18, 0.06) 0%, rgba(18, 18, 18, 0.18) 30%, rgba(18, 18, 18, 0.44) 66%, rgba(12, 12, 14, 0.72) 100%),
                linear-gradient(90deg, rgba(38, 36, 32, 0.28), rgba(38, 36, 32, 0.12), rgba(38, 36, 32, 0.28));
            pointer-events: none;
        }
        .portrait {
            position: absolute;
            inset: -4% -2% -2%;
            width: 104%;
            height: 106%;
            object-fit: cover;
            object-position: center 22%;
            filter: saturate(1.08) brightness(0.82) contrast(1.02) sepia(0.04) hue-rotate(-2deg);
            transform: scale(1.08);
            pointer-events: none;
            will-change: transform;
            opacity: 0.94;
        }
        .shade {
            position: absolute;
            inset: 0;
            z-index: 1;
            background: linear-gradient(180deg, rgba(10,10,12,0.12) 0%, rgba(10,10,12,0.16) 18%, rgba(10,10,12,0.22) 42%, rgba(10,10,12,0.68) 100%);
            pointer-events: none;
        }
        .content {
            position: relative;
            z-index: 2;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            text-align: center;
            padding: max(8vh, 52px) 24px max(5vh, calc(32px + env(safe-area-inset-bottom)));
            text-shadow: 0 2px 20px rgba(0,0,0,0.45);
        }
        .brand-name, .creator-label, .weirdo, .tagline, .enter, .footer { font-style: normal; }
        .brand-name {
            font-weight: 400;
            font-size: clamp(42px, 8vw, 88px);
            letter-spacing: 0.24em;
            line-height: 1;
            text-transform: uppercase;
        }
        .creator-label, .weirdo, .tagline {
            display: block;
            font-size: 13px;
            font-weight: 400;
            letter-spacing: 0.12em;
            line-height: 1.35;
        }
        .creator-label { margin-top: 16px; opacity: 0.82; }
        .weirdo { margin-top: 8px; opacity: 0.82; }
        .tagline { margin-top: 8px; opacity: 0.66; }
        .enter {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 180px;
            height: 52px;
            border: 1px solid rgba(255,255,255,0.68);
            border-radius: 999px;
            color: #fff;
            text-decoration: none;
            font-size: 11px;
            font-weight: 500;
            letter-spacing: 0.32em;
            text-transform: uppercase;
            background: rgba(12, 12, 14, 0.34);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            box-shadow: inset 0 0 0 1px rgba(255,255,255,0.04), 0 14px 28px rgba(0,0,0,0.12);
            animation: edge 3.6s ease-in-out 1.2s infinite;
            transition: transform 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
        }
        .enter:hover,
        .enter:focus-visible {
            transform: translateY(-1px);
            border-color: rgba(255,255,255,0.8);
            background: rgba(18, 18, 20, 0.38);
            box-shadow: inset 0 0 0 1px rgba(255,255,255,0.08), 0 14px 28px rgba(0,0,0,0.14);
        }
        .footer {
            display: flex;
            gap: 10px;
            align-items: baseline;
            font-size: 10px;
            letter-spacing: 0.22em;
            text-transform: uppercase;
            opacity: 0.7;
        }
        .handle {
            display: inline-flex;
            align-items: center;
            line-height: 1;
        }
        .at-sign {
            display: inline-block;
            line-height: 1;
            font-size: 0.82em;
        }
        .handle-name { line-height: 1; }
        .impressum-link { color: inherit; text-decoration: none; letter-spacing: inherit; font: inherit; }
        .separator { opacity: 0.45; letter-spacing: 0; }
        @keyframes edge {
            0%, 100% { border-color: rgba(255,255,255,0.4); }
            50% { border-color: #fff; }
        }
        @media (min-width: 768px) {
            .hero {
                background:
                    radial-gradient(ellipse at center, #6b645d 0%, #514a45 42%, #252326 72%, #09090b 100%);
            }
            .hero::before {
                inset: -5%;
                background: url("hintergrund_schnoez_1_large.jpg") center top / cover no-repeat;
                filter: blur(36px) brightness(0.58) saturate(0.72);
                opacity: 0.78;
                transform: scale(1.08);
            }
            .portrait {
                inset: 0;
                width: 100%;
                height: 100%;
                object-fit: contain;
                object-position: center center;
                filter: saturate(1.08) brightness(0.82) contrast(1.02) sepia(0.04) hue-rotate(-2deg);
                opacity: 0.98;
                -webkit-mask-image: linear-gradient(90deg, transparent calc(50% - 38vh), #000 calc(50% - 12vh), #000 calc(50% + 12vh), transparent calc(50% + 38vh));
                mask-image: linear-gradient(90deg, transparent calc(50% - 38vh), #000 calc(50% - 12vh), #000 calc(50% + 12vh), transparent calc(50% + 38vh));
            }
            .shade {
                background:
                    linear-gradient(180deg, rgba(10,10,12,0.16) 0%, rgba(10,10,12,0.08) 24%, rgba(10,10,12,0.18) 62%, rgba(10,10,12,0.76) 100%),
                    linear-gradient(90deg, rgba(10,10,12,0.22), transparent 34%, transparent 66%, rgba(10,10,12,0.22));
            }
        }
        @media (max-width: 767px) {
            .brand-name { font-size: clamp(36px, 12vw, 56px); letter-spacing: 0.16em; }
            .creator-label, .weirdo, .tagline { font-size: 12px; }
            .enter { width: 164px; height: 48px; letter-spacing: 0.28em; }
        }
        @media (prefers-reduced-motion: reduce) { .enter { animation: none; } }
    </style>
</head>
<body>
    <main class="hero">
        <img class="portrait" src="hintergrund_schnoez_1_large.jpg" alt="SCHNOEZ">
        <div class="shade"></div>
        <div class="content">
            <header>
                <h1 class="brand-name">Schnoez</h1>
                <span class="creator-label">Content Creator</span>
                <span class="weirdo">You probably shouldn't be here.</span>
            </header>
            <a class="enter" href="https://schnoez.de" id="enter-btn">Enter</a>
            <footer class="footer">
                <span class="handle"><span class="at-sign">@</span><span class="handle-name">schnoez</span></span>
                <span class="separator">·</span>
                <a href="impressum.html" class="impressum-link">Impressum</a>
            </footer>
        </div>
    </main>
    <script>
        window.addEventListener("pageshow", function (event) {
            if (event.persisted) location.reload();
        });
        const portrait = document.querySelector(".portrait");
        let targetX = 0, targetY = 0, currentX = 0, currentY = 0;
        let baseBeta = null, baseGamma = null;
        function tick() {
            currentX += (targetX - currentX) * 0.06;
            currentY += (targetY - currentY) * 0.06;
            portrait.style.transform = `translate3d(${currentX.toFixed(2)}px, ${currentY.toFixed(2)}px, 0)`;
            requestAnimationFrame(tick);
        }
        requestAnimationFrame(tick);
        if (window.matchMedia("(pointer: fine)").matches) {
            window.addEventListener("pointermove", (e) => {
                targetX = ((e.clientX / window.innerWidth) - 0.5) * 12;
                targetY = ((e.clientY / window.innerHeight) - 0.5) * 8;
            });
        } else {
            function onTilt(e) {
                if (baseBeta === null) { baseBeta = e.beta; baseGamma = e.gamma; }
                targetX = Math.max(-10, Math.min(10, (e.gamma - baseGamma) * 0.25));
                targetY = Math.max(-8, Math.min(8, (e.beta - baseBeta) * 0.18));
            }
            function enableTilt() {
                if (typeof DeviceOrientationEvent !== "undefined" && typeof DeviceOrientationEvent.requestPermission === "function") {
                    DeviceOrientationEvent.requestPermission().then((state) => {
                        if (state === "granted") window.addEventListener("deviceorientation", onTilt);
                    }).catch(() => {});
                } else window.addEventListener("deviceorientation", onTilt);
            }
            window.addEventListener("pointerdown", enableTilt, { once: true });
        }
        document.getElementById("enter-btn").addEventListener("click", function () {
            this.textContent = "Loading...";
        });
    </script>
</body>
</html>
