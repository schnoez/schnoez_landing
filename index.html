<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <title>SCHNOEZ — Content Creator</title>

    <meta
        name="description"
        content="SCHNOEZ — Content Creator"
    >

    <meta name="theme-color" content="#050505">

    <!-- Open Graph -->
    <meta property="og:title" content="SCHNOEZ">
    <meta property="og:description" content="Content Creator">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://schnoez.com">

    <style>

        /* =========================================================
           RESET
        ========================================================= */

        *,
        *::before,
        *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            background: #050505;
        }

        body {
            overflow: hidden;

            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Helvetica Neue",
                Helvetica,
                Arial,
                sans-serif;

            color: #ffffff;
        }


        /* =========================================================
           MAIN HERO
        ========================================================= */

        .hero {
            position: relative;

            width: 100%;
            height: 100dvh;
            min-height: 100vh;

            overflow: hidden;

            background: #050505;

            isolation: isolate;
        }


        /* =========================================================
           AMBIENT BACKGROUND
        ========================================================= */

        .ambient {
            position: absolute;

            inset: -70px;

            z-index: 0;

            background-image: url("hero.jpg");

            background-size: cover;
            background-position: center center;

            filter:
                blur(45px)
                saturate(0.85)
                brightness(0.52);

            transform: scale(1.08);

            opacity: 0.85;

            pointer-events: none;
        }


        /* =========================================================
           DARK CINEMATIC BACKGROUND
        ========================================================= */

        .background-darkness {
            position: absolute;

            inset: 0;

            z-index: 1;

            background:
                radial-gradient(
                    ellipse at center,
                    rgba(0, 0, 0, 0.02) 0%,
                    rgba(0, 0, 0, 0.22) 55%,
                    rgba(0, 0, 0, 0.62) 100%
                );

            pointer-events: none;
        }


        /* =========================================================
           MAIN PORTRAIT
        ========================================================= */

        .portrait {
            position: absolute;

            z-index: 2;

            top: 50%;
            left: 50%;

            width: 100%;
            height: 100%;

            transform:
                translate(-50%, -50%)
                scale(1);

            object-fit: contain;
            object-position: center center;

            filter:
                brightness(0.96)
                contrast(1.02)
                saturate(0.96);

            pointer-events: none;

            will-change: transform;
        }


        /* =========================================================
           EDITORIAL VIGNETTE
        ========================================================= */

        .vignette {
            position: absolute;

            inset: 0;

            z-index: 3;

            pointer-events: none;

            background:
                linear-gradient(
                    to bottom,
                    rgba(0, 0, 0, 0.38) 0%,
                    rgba(0, 0, 0, 0.04) 22%,
                    rgba(0, 0, 0, 0.00) 52%,
                    rgba(0, 0, 0, 0.20) 78%,
                    rgba(0, 0, 0, 0.72) 100%
                );

            box-shadow:
                inset 0 0 160px rgba(0, 0, 0, 0.35);
        }


        /* =========================================================
           CONTENT
        ========================================================= */

        .content {
            position: relative;

            z-index: 5;

            width: 100%;
            height: 100%;

            display: flex;
            flex-direction: column;
            align-items: center;

            justify-content: space-between;

            padding:
                max(7vh, 50px)
                28px
                max(5vh, 36px);
        }


        /* =========================================================
           BRAND
        ========================================================= */

        .brand {
            text-align: center;

            animation:
                brandReveal 1.25s
                cubic-bezier(0.22, 1, 0.36, 1)
                both;
        }


        .brand-name {
            font-size:
                clamp(
                    42px,
                    7vw,
                    88px
                );

            font-weight: 500;

            letter-spacing:
                0.24em;

            line-height: 1;

            margin-left: 0.24em;

            text-transform: uppercase;

            text-shadow:
                0 2px 25px rgba(0, 0, 0, 0.28);
        }


        /* =========================================================
           BRAND SUBTITLE
           All three lines use the same typography
        ========================================================= */

        .brand-subtitle {
            display: flex;
            flex-direction: column;
            align-items: center;

            margin-top: 17px;

            font-size: 10px;
            font-weight: 400;

            letter-spacing: 0.14em;

            text-shadow:
                0 2px 15px rgba(0, 0, 0, 0.45);
        }


        .creator-label,
        .weirdo,
        .tagline {
            font-size: 10px;
            font-weight: 400;

            letter-spacing: 0.14em;

            line-height: 1.2;

            text-transform: none;

            opacity: 0.82;
        }


        .weirdo {
            margin-top: 9px;
        }


        .tagline {
            margin-top: 8px;

            opacity: 0.68;
        }


        /* =========================================================
           CENTER ACTION
        ========================================================= */

        .action {
            display: flex;
            flex-direction: column;
            align-items: center;

            animation:
                actionReveal 1.3s
                0.25s
                cubic-bezier(0.22, 1, 0.36, 1)
                both;
        }


        /* =========================================================
           ENTER BUTTON
        ========================================================= */

        .enter {
            position: relative;

            display: flex;

            align-items: center;
            justify-content: center;

            width: 190px;
            height: 56px;

            border:
                1px solid
                rgba(255, 255, 255, 0.68);

            border-radius: 999px;

            color: #ffffff;

            text-decoration: none;

            font-size: 11px;

            font-weight: 500;

            letter-spacing: 0.34em;

            text-transform: uppercase;

            margin-left: 0.34em;

            background:
                rgba(10, 10, 10, 0.16);

            backdrop-filter:
                blur(12px)
                saturate(120%);

            -webkit-backdrop-filter:
                blur(12px)
                saturate(120%);

            box-shadow:
                0 10px 40px
                rgba(0, 0, 0, 0.20),

                inset 0 1px 0
                rgba(255, 255, 255, 0.12);

            transition:
                transform 0.45s
                cubic-bezier(0.22, 1, 0.36, 1),

                background 0.45s ease,

                border-color 0.45s ease,

                box-shadow 0.45s ease;
        }


        /* subtle highlight */

        .enter::before {
            content: "";

            position: absolute;

            inset: 1px;

            border-radius: inherit;

            background:
                linear-gradient(
                    135deg,
                    rgba(255,255,255,0.12),
                    transparent 45%
                );

            opacity: 0;

            transition:
                opacity 0.45s ease;
        }


        .enter:hover {

            transform:
                translateY(-3px);

            background:
                rgba(255, 255, 255, 0.12);

            border-color:
                rgba(255, 255, 255, 0.95);

            box-shadow:
                0 15px 50px
                rgba(0, 0, 0, 0.30),

                inset 0 1px 0
                rgba(255, 255, 255, 0.20);
        }


        .enter:hover::before {
            opacity: 1;
        }


        .enter:active {
            transform:
                translateY(0)
                scale(0.97);
        }


        /* =========================================================
           FOOTER
        ========================================================= */

        .footer {
            font-size: 9px;

            font-weight: 400;

            letter-spacing: 0.36em;

            margin-left: 0.36em;

            text-transform: uppercase;

            opacity: 0.62;

            text-shadow:
                0 2px 12px
                rgba(0, 0, 0, 0.55);

            animation:
                footerReveal 1.2s
                0.45s
                ease-out
                both;
        }


        /* =========================================================
           ANIMATIONS
        ========================================================= */

        @keyframes brandReveal {

            from {
                opacity: 0;

                transform:
                    translateY(-18px);
            }

            to {
                opacity: 1;

                transform:
                    translateY(0);
            }
        }


        @keyframes actionReveal {

            from {
                opacity: 0;

                transform:
                    translateY(22px);
            }

            to {
                opacity: 1;

                transform:
                    translateY(0);
            }
        }


        @keyframes footerReveal {

            from {
                opacity: 0;
            }

            to {
                opacity: 0.62;
            }
        }


        /* =========================================================
           DESKTOP
        ========================================================= */

        @media (min-width: 768px) {

            .content {
                padding:
                    6vh
                    50px
                    4vh;
            }


            .portrait {

                width: 100%;
                height: 100%;

                object-fit: contain;

                transform:
                    translate(-50%, -50%)
                    scale(1.01);
            }


            .brand-name {
                font-size:
                    clamp(
                        58px,
                        6vw,
                        94px
                    );
            }


            .brand-subtitle {
                margin-top: 17px;
            }


            .creator-label,
            .weirdo,
            .tagline {
                font-size: 10px;

                letter-spacing: 0.15em;
            }


            .enter {
                width: 205px;
                height: 60px;
            }
        }


        /* =========================================================
           WIDE DESKTOP
        ========================================================= */

        @media (min-width: 1400px) {

            .portrait {
                height: 96%;
            }


            .ambient {
                filter:
                    blur(55px)
                    saturate(0.82)
                    brightness(0.48);
            }
        }


        /* =========================================================
           MOBILE
        ========================================================= */

        @media (max-width: 767px) {

            .ambient {

                inset: -50px;

                filter:
                    blur(32px)
                    brightness(0.48)
                    saturate(0.85);

                opacity: 0.75;
            }


            .portrait {

                width: 100%;
                height: 100%;

                object-fit: cover;

                object-position: center center;

                transform:
                    translate(-50%, -50%)
                    scale(1.005);
            }


            .content {

                padding:
                    max(6vh, 42px)
                    20px
                    max(4vh, 32px);
            }


            .brand-name {

                font-size:
                    clamp(
                        38px,
                        12vw,
                        58px
                    );

                letter-spacing:
                    0.19em;

                margin-left:
                    0.19em;
            }


            .brand-subtitle {

                margin-top: 12px;
            }


            .creator-label,
            .weirdo,
            .tagline {

                font-size: 8px;

                letter-spacing:
                    0.10em;

                line-height: 1.25;
            }


            .weirdo {
                margin-top: 8px;
            }


            .tagline {
                margin-top: 7px;
            }


            .enter {

                width: 175px;

                height: 53px;

                font-size: 10px;

                letter-spacing:
                    0.30em;

                margin-left:
                    0.30em;
            }
        }


        /* =========================================================
           SMALL PHONES
        ========================================================= */

        @media (max-width: 380px) {

            .brand-name {
                font-size: 36px;
            }


            .creator-label,
            .weirdo,
            .tagline {
                font-size: 7px;
            }


            .enter {
                width: 165px;
            }
        }


        /* =========================================================
           ACCESSIBILITY
        ========================================================= */

        @media (prefers-reduced-motion: reduce) {

            .brand,
            .action,
            .footer {

                animation: none;
            }


            .enter {

                transition: none;
            }
        }

    </style>
</head>


<body>

    <main class="hero">


        <!--
            AMBIENT BACKGROUND

            This uses the same image as the main portrait,
            enlarged and blurred, so desktop screens
            never have ugly empty areas.
        -->

        <div
            class="ambient"
            aria-hidden="true">
        </div>


        <!-- Dark cinematic layer -->

        <div
            class="background-darkness"
            aria-hidden="true">
        </div>


        <!-- Main portrait -->

        <img
            class="portrait"
            src="hero.jpg"
            alt="SCHNOEZ"
        >


        <!-- Cinematic vignette -->

        <div
            class="vignette"
            aria-hidden="true">
        </div>


        <!-- Main content -->

        <div class="content">


            <!-- BRAND -->

            <header class="brand">

                <h1 class="brand-name">
                    SCHNOEZ
                </h1>

                <div class="brand-subtitle">

                    <span class="creator-label">
                        Content Creator
                    </span>

                    <span class="weirdo">
                        weirdo
                    </span>

                    <span class="tagline">
                        You probably shouldn't be here.
                    </span>

                </div>

            </header>


            <!-- ACTION -->

            <div class="action">

                <a
                    class="enter"
                    href="https://link.me/schnoez"
                    target="_blank"
                    rel="noopener noreferrer"
                >
                    Enter
                </a>

            </div>


            <!-- FOOTER -->

            <footer class="footer">
                @schnoez
            </footer>


        </div>

    </main>


    <!--
        VERY SUBTLE DESKTOP PARALLAX

        The portrait moves only a few pixels
        when the mouse moves.

        It is intentionally subtle.
    -->

    <script>

        const portrait =
            document.querySelector(".portrait");

        const hero =
            document.querySelector(".hero");


        const desktop =
            window.matchMedia(
                "(min-width: 768px)"
            );


        if (desktop.matches) {

            hero.addEventListener(
                "mousemove",
                (event) => {

                    const x =
                        (event.clientX /
                        window.innerWidth) - 0.5;

                    const y =
                        (event.clientY /
                        window.innerHeight) - 0.5;


                    const moveX =
                        x * 8;

                    const moveY =
                        y * 5;


                    portrait.style.transform =
                        `
                        translate(
                            calc(-50% + ${moveX}px),
                            calc(-50% + ${moveY}px)
                        )
                        scale(1.01)
                        `;
                }
            );


            hero.addEventListener(
                "mouseleave",
                () => {

                    portrait.style.transform =
                        `
                        translate(-50%, -50%)
                        scale(1.01)
                        `;
                }
            );

        }

    </script>

</body>
</html>
