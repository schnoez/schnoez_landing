<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#aaa7a5">
  <meta name="description" content="SCHNOEZ — Content Creator.">
  <meta name="robots" content="index, follow">
  <title>SCHNOEZ — Content Creator</title>
  <link rel="preload" as="image" href="hero.jpg" fetchpriority="high">
  <style>
    :root {
      color-scheme: dark;
      --ink: #f4f0e8;
      --muted: rgba(244, 240, 232, .82);
      --line: rgba(244, 240, 232, .62);
      --accent: #d6c8b7;
      --ease: cubic-bezier(.2,.75,.25,1);
    }
    * { box-sizing: border-box; }
    html, body { width: 100%; min-height: 100%; margin: 0; }
    body {
      background: #aaa7a5;
      color: var(--ink);
      font-family: Inter, Helvetica, Arial, sans-serif;
      overflow: hidden;
    }
    a { color: inherit; }
    .stage {
      position: relative;
      isolation: isolate;
      width: 100%;
      min-height: 100svh;
      min-height: 100vh;
      overflow: hidden;
      background: #aaa7a5;
    }
    .ambient {
      position: absolute;
      z-index: -3;
      inset: -7%;
      width: 114%;
      height: 114%;
      object-fit: contain;
      filter: blur(42px) brightness(.9) saturate(1);
      transform: scale(1.06);
    }
    .ambient-shade {
      position: absolute;
      z-index: -2;
      inset: 0;
      background:
        linear-gradient(90deg, rgba(24,22,21,.1), transparent 30%, transparent 70%, rgba(24,22,21,.1)),
        linear-gradient(0deg, rgba(24,22,21,.18), transparent 48%);
    }
    .portrait-wrap {
      position: absolute;
      inset: 0;
      z-index: -1;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }
    .portrait {
      display: block;
      width: auto;
      height: 100%;
      max-width: 100%;
      object-fit: contain;
      object-position: center center;
      filter: brightness(.9) contrast(1.02) saturate(.95);
      animation: image-arrive 1.4s var(--ease) both;
    }
    .portrait-wrap::after {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      background: linear-gradient(0deg, rgba(24,22,21,.18), transparent 34%, transparent 70%, rgba(24,22,21,.04));
    }
    .bottomline {
      position: absolute;
      left: clamp(22px, 5.2vw, 76px);
      right: clamp(22px, 5.2vw, 76px);
      display: flex;
      align-items: center;
      justify-content: space-between;
      text-transform: uppercase;
      font-size: 9px;
      letter-spacing: .34em;
      font-weight: 500;
    }
    .content {
      position: absolute;
      inset: 0;
      animation: content-arrive 1s .12s var(--ease) both;
    }
    .wordmark {
      position: absolute;
      top: clamp(30px, 7vh, 72px);
      left: 50%;
      margin: 0;
      padding-left: .22em;
      font-size: clamp(44px, 8.1vw, 112px);
      line-height: .98;
      font-family: "Helvetica Neue", Inter, "Segoe UI", Helvetica, Arial, sans-serif;
      font-weight: 400;
      letter-spacing: .24em;
      text-transform: uppercase;
      text-shadow: 0 2px 30px rgba(0,0,0,.16);
      transform: translateX(-50%);
      white-space: nowrap;
    }
    .intro {
      position: absolute;
      top: 49%;
      left: clamp(22px, 5.2vw, 76px);
      display: flex;
      flex-direction: column;
      gap: 10px;
      max-width: min(380px, calc(100vw - 44px));
      transform: translateY(-50%);
    }
    .subtitle, .tagline {
      margin: 0;
      color: var(--ink);
      font-size: clamp(11px, 1.05vw, 13px);
      line-height: 1.4;
      font-weight: 300;
      letter-spacing: .08em;
      font-family: inherit;
    }
    .enter {
      position: absolute;
      top: 66%;
      left: 50%;
      display: inline-flex;
      justify-content: center;
      align-items: center;
      gap: 28px;
      min-width: 226px;
      min-height: 56px;
      margin: 0;
      padding: 0 28px 0 34px;
      border: 1px solid rgba(244,240,232,.86);
      border-radius: 999px;
      background: rgba(22,21,19,.12);
      color: var(--ink);
      text-decoration: none;
      text-transform: uppercase;
      font-size: 10px;
      font-weight: 500;
      letter-spacing: .42em;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      transition: background .35s var(--ease), color .35s var(--ease), border-color .35s var(--ease), transform .35s var(--ease);
      transform: translate(-50%, -50%);
    }
    .enter .arrow { font-size: 19px; line-height: 1; letter-spacing: 0; transition: transform .35s var(--ease); }
    .enter:hover, .enter:focus-visible {
      background: var(--accent);
      border-color: var(--accent);
      color: #282522;
      transform: translate(-50%, calc(-50% - 2px));
      outline: none;
    }
    .enter:hover .arrow, .enter:focus-visible .arrow { transform: translateX(4px); }
    .bottomline {
      bottom: clamp(22px, 4.2vh, 42px);
      color: var(--muted);
      font-size: 8px;
      letter-spacing: .34em;
      line-height: 1.9;
    }
    .social, .legal { font-family: inherit; }
    .social { display: flex; flex-direction: column; gap: 2px; text-decoration: none; }
    .social span:last-child { letter-spacing: .25em; }
    .legal { text-decoration: none; transition: color .25s ease; }
    .legal:hover { color: var(--ink); }
    .bottomline::after {
      content: "";
      position: absolute;
      left: 50%;
      bottom: calc(-1 * clamp(22px, 4.2vh, 42px));
      height: clamp(26px, 5vh, 54px);
      width: 1px;
      background: var(--line);
      opacity: .8;
    }
    @keyframes image-arrive { from { opacity: 0; transform: scale(1.025); } to { opacity: 1; transform: scale(1); } }
    @keyframes content-arrive { from { opacity: 0; translate: 0 12px; } to { opacity: 1; translate: 0 0; } }
    @media (min-width: 900px) {
      .enter { min-width: 250px; min-height: 60px; }
      .wordmark { font-size: clamp(68px, 7.3vw, 112px); }
    }
    @media (min-width: 601px) {
      .portrait {
        -webkit-mask-image: linear-gradient(90deg, transparent, #000 20%, #000 80%, transparent);
        mask-image: linear-gradient(90deg, transparent, #000 20%, #000 80%, transparent);
      }
    }
    @media (max-width: 600px) {
      .content { --mobile-wordmark-size: clamp(38px, 10.3vw, 60px); }
      .ambient { object-fit: cover; }
      .portrait { width: 100%; height: 100%; max-width: none; object-fit: cover; object-position: center 43%; }
      .ambient { filter: blur(24px) brightness(.9) saturate(1); }
      .ambient-shade { background: linear-gradient(0deg, rgba(24,22,21,.18), transparent 48%); }
      .portrait-wrap::after { background: linear-gradient(0deg, rgba(24,22,21,.18), transparent 40%, transparent 68%, rgba(24,22,21,.04)); }
      .bottomline { font-size: 7px; letter-spacing: .25em; }
      .wordmark { font-size: var(--mobile-wordmark-size); letter-spacing: .2em; padding-left: .2em; }
      .intro {
        top: calc(clamp(30px, 7vh, 72px) + var(--mobile-wordmark-size) + 16px);
        left: 50%;
        align-items: center;
        max-width: calc(100vw - 32px);
        text-align: center;
        transform: translateX(-50%);
      }
      .subtitle, .tagline { font-size: 11px; }
      .enter { top: 66%; min-width: 206px; min-height: 52px; }
      .bottomline { bottom: 24px; }
      .bottomline::after { height: 28px; bottom: -24px; }
    }
    @media (max-width: 360px) {
      .content { --mobile-wordmark-size: 35px; }
      .wordmark { letter-spacing: .16em; padding-left: .16em; }
      .subtitle, .tagline { font-size: 10px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; scroll-behavior: auto !important; transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <main class="stage">
    <img class="ambient" src="hero.jpg" alt="" aria-hidden="true">
    <div class="ambient-shade" aria-hidden="true"></div>
    <div class="portrait-wrap" aria-hidden="true">
      <img class="portrait" src="hero.jpg" alt="">
    </div>

    <section class="content" aria-labelledby="brand">
      <h1 class="wordmark" id="brand">Schnoez</h1>
      <div class="intro">
        <p class="subtitle">Content Creator</p>
        <p class="tagline">You probably shouldn't be here.</p>
      </div>
      <a class="enter" href="https://schnoez.de" aria-label="Enter schnoez.de">
        <span>Enter</span><span class="arrow" aria-hidden="true">→</span>
      </a>
    </section>

    <footer class="bottomline">
      <a class="social" href="https://www.instagram.com/schnoez/" target="_blank" rel="noopener noreferrer" aria-label="Instagram @schnoez">
        <span>Instagram</span><span>@schnoez</span>
      </a>
      <a class="legal" href="impressum.html">Impressum</a>
    </footer>
  </main>
</body>
</html>
