<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

    <title>SCHNOEZ</title>

    <meta name="description" content="SCHNOEZ — Content Creator">
    <meta name="theme-color" content="#000000">

    <meta property="og:title" content="SCHNOEZ">
    <meta property="og:description" content="Content Creator">
    <meta property="og:type" content="website">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            color: #fff;
        }

        .hero {
            position: relative;
            width: 100%;
            height: 100dvh;
            min-height: 100vh;
            overflow: hidden;
            background: #000;
        }

        .hero-image {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center center;
            transform: scale(1.01);
        }

        /* Subtle cinematic overlay */
        .overlay {
            position: absolute;
            inset: 0;
            background:
                linear-gradient(
                    to bottom,
                    rgba(0,0,0,0.28) 0%,
                    rgba(0,0,0,0.02) 38%,
                    rgba(0,0,0,0.04) 58%,
                    rgba(0,0,0,0.48) 100%
                );
        }

        .content {
            position: relative;
            z-index: 2;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding:
                max(8vh, 55px)
                25px
                max(7vh, 45px);
        }

        .brand {
            text-align: center;
            animation: fadeDown 1.2s ease-out both;
        }

        .brand h1 {
            font-size: clamp(42px, 8vw, 82px);
            font-weight: 600;
            letter-spacing: 0.22em;
            margin-left: 0.22em;
            line-height: 1;
        }

        .brand p {
            margin-top: 15px;
            font-size: 11px;
            letter-spacing: 0.42em;
            margin-left: 0.42em;
            text-transform: uppercase;
            opacity: 0.9;
        }

        .enter-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 18px;
            animation: fadeUp 1.2s 0.25s ease-out both;
        }

        .enter-button {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;

            width: 180px;
            height: 54px;

            border: 1px solid rgba(255,255,255,0.75);
            border-radius: 999px;

            color: #fff;
            text-decoration: none;

            font-size: 12px;
            font-weight: 500;
            letter-spacing: 0.32em;
            text-transform: uppercase;

            backdrop-filter: blur(5px);
            -webkit-backdrop-filter: blur(5px);

            background: rgba(0,0,0,0.12);

            transition:
                background 0.35s ease,
                border-color 0.35s ease,
                transform 0.35s ease;
        }

        .enter-button:hover {
            background: rgba(255,255,255,0.16);
            border-color: #fff;
            transform: translateY(-2px);
        }

        .enter-button:active {
            transform: scale(0.97);
        }

        .footer {
            font-size: 9px;
            letter-spacing: 0.28em;
            text-transform: uppercase;
            opacity: 0.7;
            animation: fadeUp 1.2s 0.4s ease-out both;
        }

        @keyframes fadeDown {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Desktop */
        @media (min-width: 768px) {

            .hero-image {
                object-position: center center;
            }

            .content {
                padding:
                    7vh
                    50px
                    5vh;
            }

            .brand h1 {
                font-size: clamp(55px, 6vw, 88px);
            }

            .enter-button {
                width: 200px;
                height: 58px;
            }
        }

        /* Mobile */
        @media (max-width: 767px) {

            .hero-image {
                object-position: center center;
            }

            .content {
                padding:
                    max(7vh, 45px)
                    20px
                    max(5vh, 35px);
            }

            .brand h1 {
                font-size: clamp(38px, 12vw, 58px);
                letter-spacing: 0.18em;
                margin-left: 0.18em;
            }

            .brand p {
                font-size: 9px;
                letter-spacing: 0.32em;
                margin-left: 0.32em;
                margin-top: 12px;
            }

            .enter-button {
                width: 170px;
                height: 52px;
            }
        }

        /* Respect users who prefer reduced motion */
        @media (prefers-reduced-motion: reduce) {
            .brand,
            .enter-container,
            .footer {
                animation: none;
            }

            .enter-button {
                transition: none;
            }
        }
    </style>
</head>

<body>

    <main class="hero">

        <img
            class="hero-image"
            src="hero.jpg"
            alt="SCHNOEZ"
        >

        <div class="overlay"></div>

        <div class="content">

            <header class="brand">
                <h1>SCHNOEZ</h1>
                <p>Content Creator</p>
            </header>

            <div class="enter-container">

                <!--
                    REPLACE THIS URL LATER
                    with your external link page.
                -->
                <a
                    class="enter-button"
                    href="https://link.me/schnoez"
                    target="_blank"
                    rel="noopener noreferrer"
                >
                    Enter
                </a>

            </div>

            <div class="footer">
                @schnoez
            </div>

        </div>

    </main>

</body>
</html>
