<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>SCHNOEZ — Content Creator</title>
    <meta name="description" content="SCHNOEZ — Content Creator">
    <meta name="theme-color" content="#050505">
    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="apple-touch-icon" href="favicon.png">
    <meta property="og:title" content="SCHNOEZ">
    <meta property="og:description" content="Content Creator">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://schnoez.com">
    <style>
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { width: 100%; height: 100%; background: #050505; }
        body {
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Helvetica, Arial, sans-serif;
            color: #ffffff;
        }
        .hero {
            position: relative;
            width: 100%;
            height: 100dvh;
            min-height: 100vh;
            overflow: hidden;
            background: #050505;
            isolation: isolate;
        }
        .ambient {
            position: absolute;
            inset: -70px;
            z-index: 0;
            background-image: url("hintergrund_schnoez_1_large.jpg");
            background-size: cover;
            background-position: center center;
            filter: blur(45px) saturate(0.85) brightness(0.52);
            transform: scale(1.08);
            opacity: 0.85;
            pointer-events: none;
        }
        .background-darkness {
            position: absolute;
            inset: 0;
            z-index: 1;
            background: radial-gradient(ellipse at center, rgba(0,0,0,0.02) 0%, rgba(0,0,0,0.22) 55%, rgba(0,0,0,0.62) 100%);
            pointer-events: none;
            animation: breathe 9s ease-in-out infinite alternate;
        }
        .portrait {
            position: absolute;
            z-index: 2;
            top: 50%;
            left: 50%;
            width: 108%;
            height: 108%;
            object-fit: contain;
            object-position: center center;
            filter: brightness(0.96) contrast(1.02) saturate(0.96);
            transform: translate3d(-50%, -50%, 0);
            pointer-events: none;
            will-change: transform;
        }
        .vignette {
            position: absolute;
            inset: 0;
            z-index: 3;
            pointer-events: none;
            background: linear-gradient(to bottom, rgba(0,0,0,0.38) 0%, rgba(0,0,0,0.04) 22%, rgba(0,0,0,0) 52%, rgba(0,0,0,0.20) 78%, rgba(0,0,0,0.72) 100%);
            box-shadow: inset 0 0 160px rgba(0,0,0,0.35);
        }
        .content {
            position: relative;
            z-index: 5;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: max(7vh, 50px) 28px max(5vh, calc(36px + env(safe-area-inset-bottom)));
        }
        .brand {
            text-align: center;
            animation: brandReveal 1.25s cubic-bezier(0.22, 1, 0.36, 1) both;
        }
        .brand-name {
            font-size: clamp(42px, 7vw, 88px);
            font-weight: 500;
            letter-spacing: 0.24em;
            line-height: 1;
            margin-left: 0.24em;
            text-transform: uppercase;
            text-shadow: 0 2px 25px rgba(0,0,0,0.28);
        }
        .brand-subtitle {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-top: 17px;
        }
        .creator-label, .weirdo, .tagline {
            font-size: 14px;
            font-weight: 400;
            letter-spacing: 0.14em;
            line-height: 1.2;
            text-transform: none;
            opacity: 0.82;
        }
        .weirdo { margin-top: 9px; }
        .tagline { margin-top: 8px; opacity: 0.68; }
        .action {
            display: flex;
            flex-direction: column;
            align-items: center;
            animation: actionReveal 1.3s 0.25s cubic-bezier(0.22, 1, 0.36, 1) both;
        }
        .enter {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 190px;
            height: 56px;
            border: 1px solid rgba(255,255,255,0.68);
            border-radius: 999px;
            color: #ffffff;
            text-decoration: none;
            user-select: none;
            cursor: pointer;
            font-size: 11px;
            font-weight: 500;
            letter-spacing: 0.34em;
            text-transform: uppercase;
            margin-left: 0.34em;
            background: rgba(12, 12, 12, 0.38);
            backdrop-filter: blur(16px) saturate(140%);
            -webkit-backdrop-filter: blur(16px) saturate(140%);
            box-shadow: 0 10px 40px rgba(0,0,0,0.20), inset 0 1px 0 rgba(255,255,255,0.12);
            transition: transform 0.45s cubic-bezier(0.22, 1, 0.36, 1), background 0.45s ease, border-color 0.45s ease, box-shadow 0.45s ease, opacity 0.3s ease;
            animation: edge 3.6s ease-in-out 1.2s infinite;
        }
        .enter::before {
            content: "";
            position: absolute;
            inset: 1px;
            border-radius: inherit;
            background: linear-gradient(135deg, rgba(255,255,255,0.12), transparent 45%);
            opacity: 0;
            transition: opacity 0.45s ease;
        }
        .enter:hover {
            transform: translateY(-3px);
            background: rgba(255,255,255,0.12);
            border-color: rgba(255,255,255,0.95);
        }
        .enter:hover::before { opacity: 1; }
        .footer {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 10px;
            font-weight: 400;
            letter-spacing: 0.22em;
            text-transform: uppercase;
            opacity: 0.62;
            text-shadow: 0 2px 12px rgba(0,0,0,0.55);
            animation: footerReveal 1.2s 0.45s ease-out both;
        }
        .separator { opacity: 0.45; letter-spacing: 0; }
        .impressum-link {
            color: inherit;
            font: inherit;
            letter-spacing: inherit;
            text-transform: inherit;
            text-decoration: none;
        }
        .impressum-link:hover { opacity: 0.7; }
        @keyframes edge {
            0%, 100% {
                border-color: rgba(255, 255, 255, 0.35);
                box-shadow: 0 10px 40px rgba(0,0,0,0.20), inset 0 1px 0 rgba(255,255,255,0.08);
            }
            50% {
                border-color: rgba(255, 255, 255, 1);
                box-shadow: 0 0 0 1px rgba(255,255,255,0.25), 0 10px 36px rgba(255,255,255,0.12);
            }
        }
        @keyframes breathe {
            from { opacity: 0.82; }
            to { opacity: 1; }
        }
        @keyframes brandReveal {
            from { opacity: 0; transform: translateY(-18px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes actionReveal {
            from { opacity: 0; transform: translateY(22px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes footerReveal {
            from { opacity: 0; }
            to { opacity: 0.62; }
        }
        @media (min-width: 768px) {
            .content { padding: 6vh 50px 4vh; }
            .brand-name { font-size: clamp(58px, 6vw, 94px); }
            .enter { width: 205px; height: 60px; }
        }
        @media (max-width: 767px) {
            .ambient {
                inset: -50px;
                filter: blur(16px) brightness(0.48) saturate(0.85);
                opacity: 0.75;
            }
            .portrait { object-fit: cover; }
            .content { padding: max(8vh, 52px) 20px max(5vh, calc(36px + env(safe-area-inset-bottom))); }
            .brand-name {
                font-size: clamp(38px, 12vw, 58px);
                letter-spacing: 0.19em;
                margin-left: 0.19em;
            }
            .brand-subtitle { margin-top: 12px; }
            .creator-label, .weirdo, .tagline {
                font-size: 11px;
                letter-spacing: 0.10em;
                line-height: 1.25;
            }
            .weirdo { margin-top: 8px; }
            .tagline { margin-top: 7px; }
            .enter {
                width: 175px;
                height: 53px;
                font-size: 10px;
                letter-spacing: 0.30em;
                margin-left: 0.30em;
                background: rgba(8, 8, 8, 0.55);
                -webkit-backdrop-filter: blur(18px) saturate(160%);
                backdrop-filter: blur(18px) saturate(160%);
            }
        }
        @media (max-width: 380px) {
            .brand-name { font-size: 36px; }
            .creator-label, .weirdo, .tagline { font-size: 9px; }
            .enter { width: 165px; }
        }
        @media (prefers-reduced-motion: reduce) {
            .brand, .action, .footer, .background-darkness, .enter { animation: none; }
        }
    </style>
</head>
<body>
    <main class="hero">
        <div class="ambient" aria-hidden="true"></div>
        <div class="background-darkness" aria-hidden="true"></div>
        <img class="portrait" src="hintergrund_schnoez_1_large.jpg" alt="SCHNOEZ">
        <div class="vignette" aria-hidden="true"></div>
        <div class="content">
            <header class="brand">
                <h1 class="brand-name">SCHNOEZ</h1>
                <div class="brand-subtitle">
                    <span class="creator-label">Content Creator</span>
                    <span class="weirdo">weirdo</span>
                    <span class="tagline">You probably shouldn't be here.</span>
                </div>
            </header>
            <div class="action">
                <a class="enter" href="#" id="enter-btn">Enter</a>
            </div>
            <footer class="footer">
                @schnoez
                <span class="separator">·</span>
                <a href="/impressum.html" class="impressum-link">Impressum</a>
            </footer>
        </div>
    </main>
    <script>
        const enterBtn = document.getElementById("enter-btn");

        function resetEnter() {
            enterBtn.textContent = "Enter";
            enterBtn.style.opacity = "";
            enterBtn.style.pointerEvents = "";
        }

        window.addEventListener("pagehide", resetEnter);
        window.addEventListener("pageshow", function () {
            setTimeout(resetEnter, 0);
        });

        const portrait = document.querySelector(".portrait");
        const desktop = window.matchMedia("(min-width: 768px)").matches;
        let targetX = 0;
        let targetY = 0;
        let currentX = 0;
        let currentY = 0;

        if (desktop) {
            window.addEventListener("pointermove", (e) => {
                targetX = ((e.clientX / window.innerWidth) - 0.5) * 16;
                targetY = ((e.clientY / window.innerHeight) - 0.5) * 10;
            });

            function tick() {
                currentX += (targetX - currentX) * 0.045;
                currentY += (targetY - currentY) * 0.045;
                portrait.style.transform =
                    `translate3d(calc(-50% + ${currentX.toFixed(2)}px), calc(-50% + ${currentY.toFixed(2)}px), 0)`;
                requestAnimationFrame(tick);
            }
            requestAnimationFrame(tick);
        }

        enterBtn.addEventListener("click", function (e) {
            e.preventDefault();
            this.textContent = "Loading...";
            this.style.opacity = "0.65";
            this.style.pointerEvents = "none";
            setTimeout(function () {
                window.location.href = "https://schnoez.de";
            }, 400);
        });
    </script>
</body>
</html>
