<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>SCHNOEZ — Content Creator</title>
    <meta name="description" content="SCHNOEZ — Content Creator">
    <meta name="theme-color" content="#050505">
    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="apple-touch-icon" href="favicon.png">
    <meta property="og:title" content="SCHNOEZ">
    <meta property="og:description" content="Content Creator">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://schnoez.com">
    <style>
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { width: 100%; height: 100%; background: #050505; }
        body {
            overflow: hidden;
            color: #fff;
            background: #050505;
            font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Helvetica, Arial, sans-serif;
        }
        .hero {
            height: 100dvh;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 28px 18px max(72px, calc(48px + env(safe-area-inset-bottom)));
        }
        .frame { position: relative; width: min(86vw, 460px); }
        .overlay {
            position: absolute;
            z-index: 3;
            top: 0;
            left: 0;
            right: 0;
            text-align: center;
            transform: translateY(-18%);
            text-shadow: 0 8px 24px rgba(0,0,0,0.55);
        }
        .brand-name {
            font-weight: 500;
            font-size: clamp(42px, 12vw, 84px);
            letter-spacing: 0.16em;
            line-height: 0.9;
            text-transform: uppercase;
        }
        .creator-label, .weirdo, .tagline {
            display: block;
            font-size: 11px;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            opacity: 0.84;
        }
        .creator-label { margin-top: 12px; }
        .weirdo { margin-top: 6px; }
        .tagline {
            margin-top: 7px;
            text-transform: none;
            letter-spacing: 0.03em;
            font-style: italic;
            opacity: 0.7;
        }
        .portrait {
            display: block;
            width: 72%;
            margin: 34px auto 0;
            aspect-ratio: 3 / 4;
            object-fit: cover;
            object-position: center 18%;
            filter: brightness(0.94) contrast(1.04) saturate(0.9);
            box-shadow: 0 28px 70px rgba(0,0,0,0.4);
            pointer-events: none;
        }
        .enter {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 168px;
            height: 50px;
            margin: 26px auto 0;
            border: 1px solid rgba(255,255,255,0.7);
            border-radius: 999px;
            color: #fff;
            text-decoration: none;
            letter-spacing: 0.32em;
            text-transform: uppercase;
            font-size: 11px;
            font-weight: 500;
            background: #141414;
            animation: edge 3.6s ease-in-out 1.2s infinite;
        }
        .footer {
            position: absolute;
            left: 0; right: 0;
            bottom: max(20px, env(safe-area-inset-bottom));
            display: flex;
            justify-content: center;
            gap: 10px;
            font-size: 10px;
            letter-spacing: 0.22em;
            text-transform: uppercase;
            opacity: 0.6;
        }
        .impressum-link { color: inherit; text-decoration: none; letter-spacing: inherit; }
        .separator { opacity: 0.45; letter-spacing: 0; }
        @keyframes edge {
            0%, 100% { border-color: rgba(255,255,255,0.4); }
            50% { border-color: #fff; }
        }
        @media (max-width: 767px) {
            .frame { width: min(88vw, 360px); }
            .brand-name { font-size: clamp(36px, 12vw, 58px); letter-spacing: 0.12em; }
            .portrait { width: 70%; margin-top: 28px; }
        }
        @media (prefers-reduced-motion: reduce) { .enter { animation: none; } }
    </style>
</head>
<body>
    <main class="hero">
        <div class="frame">
            <img class="portrait" src="hintergrund_schnoez_1_large.jpg" alt="SCHNOEZ">
            <div class="overlay">
                <h1 class="brand-name">Schnoez</h1>
                <span class="creator-label">Content Creator</span>
                <span class="weirdo">weirdo</span>
                <span class="tagline">You probably shouldn't be here.</span>
            </div>
        </div>
        <a class="enter" href="https://schnoez.de" id="enter-btn">Enter</a>
        <footer class="footer">
            @schnoez
            <span class="separator">·</span>
            <a href="/impressum.html" class="impressum-link">Impressum</a>
        </footer>
    </main>
    <script>
        window.addEventListener("pageshow", function (event) {
            if (event.persisted) location.reload();
        });
        const portrait = document.querySelector(".portrait");
        let targetX = 0, targetY = 0, currentX = 0, currentY = 0;
        let baseBeta = null, baseGamma = null;
        function tick() {
            currentX += (targetX - currentX) * 0.06;
            currentY += (targetY - currentY) * 0.06;
            portrait.style.transform = `translate3d(${currentX.toFixed(2)}px, ${currentY.toFixed(2)}px, 0)`;
            requestAnimationFrame(tick);
        }
        requestAnimationFrame(tick);
        if (window.matchMedia("(pointer: fine)").matches) {
            window.addEventListener("pointermove", (e) => {
                targetX = ((e.clientX / window.innerWidth) - 0.5) * 8;
                targetY = ((e.clientY / window.innerHeight) - 0.5) * 6;
            });
        } else {
            function onTilt(e) {
                if (baseBeta === null) { baseBeta = e.beta; baseGamma = e.gamma; }
                targetX = Math.max(-8, Math.min(8, (e.gamma - baseGamma) * 0.22));
                targetY = Math.max(-6, Math.min(6, (e.beta - baseBeta) * 0.16));
            }
            function enableTilt() {
                if (typeof DeviceOrientationEvent !== "undefined" && typeof DeviceOrientationEvent.requestPermission === "function") {
                    DeviceOrientationEvent.requestPermission().then((state) => {
                        if (state === "granted") window.addEventListener("deviceorientation", onTilt);
                    }).catch(() => {});
                } else window.addEventListener("deviceorientation", onTilt);
            }
            window.addEventListener("pointerdown", enableTilt, { once: true });
        }
        document.getElementById("enter-btn").addEventListener("click", function () {
            this.textContent = "Loading...";
        });
    </script>
</body>
</html>
