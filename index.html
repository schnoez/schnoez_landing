<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>SCHNOEZ — Content Creator</title>
    <meta name="description" content="SCHNOEZ — Content Creator">
    <meta name="theme-color" content="#050505">
    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="apple-touch-icon" href="favicon.png">
    <meta property="og:title" content="SCHNOEZ">
    <meta property="og:description" content="Content Creator">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://schnoez.com">
    <style>
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { width: 100%; height: 100%; background: #050505; }
        body {
            overflow: hidden;
            color: #fff;
            background: #050505;
            font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Helvetica, Arial, sans-serif;
        }
        .hero {
            position: relative;
            width: 100%;
            height: 100dvh;
            min-height: 100vh;
            overflow: hidden;
            background: #050505;
        }
        .wash {
            position: absolute;
            inset: -40px;
            background: #050505 url("hintergrund_schnoez_1_large.jpg") center / cover no-repeat;
            filter: grayscale(1) blur(28px) brightness(0.28);
            transform: scale(1.08);
            pointer-events: none;
        }
        .portrait {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: contain;
            object-position: center center;
            filter: grayscale(1) brightness(0.72) contrast(1.06);
            pointer-events: none;
        }
        .shade {
            position: absolute;
            inset: 0;
            background: linear-gradient(to bottom, rgba(0,0,0,0.55) 0%, rgba(0,0,0,0.18) 34%, rgba(0,0,0,0.35) 72%, rgba(0,0,0,0.72) 100%);
            pointer-events: none;
        }
        .content {
            position: relative;
            z-index: 2;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            text-align: center;
            padding: max(8vh, 52px) 24px max(5vh, calc(32px + env(safe-area-inset-bottom)));
        }
        .brand-name, .creator-label, .weirdo, .tagline, .enter, .footer { font-family: inherit; font-style: normal; }
        .brand-name {
            font-weight: 500;
            font-size: clamp(42px, 8vw, 88px);
            letter-spacing: 0.2em;
            line-height: 1;
            text-transform: uppercase;
        }
        .creator-label, .weirdo, .tagline {
            display: block;
            font-size: 13px;
            font-weight: 400;
            letter-spacing: 0.14em;
            line-height: 1.35;
        }
        .creator-label { margin-top: 16px; opacity: 0.82; }
        .weirdo { margin-top: 8px; opacity: 0.82; }
        .tagline { margin-top: 8px; opacity: 0.66; }
        .enter {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 180px;
            height: 52px;
            border: 1px solid rgba(255,255,255,0.7);
            border-radius: 999px;
            color: #fff;
            text-decoration: none;
            font-size: 11px;
            font-weight: 500;
            letter-spacing: 0.32em;
            text-transform: uppercase;
            background: rgba(8,8,8,0.72);
            animation: edge 3.6s ease-in-out 1.2s infinite;
        }
        .footer {
            display: flex;
            gap: 10px;
            align-items: center;
            font-size: 10px;
            letter-spacing: 0.22em;
            text-transform: uppercase;
            opacity: 0.7;
        }
        .impressum-link { color: inherit; text-decoration: none; letter-spacing: inherit; font: inherit; }
        .separator { opacity: 0.45; letter-spacing: 0; }
        @keyframes edge {
            0%, 100% { border-color: rgba(255,255,255,0.4); }
            50% { border-color: #fff; }
        }
        @media (max-width: 767px) {
            .wash { display: none; }
            .portrait { object-fit: cover; filter: grayscale(1) brightness(0.55) contrast(1.08); }
            .brand-name { font-size: clamp(36px, 12vw, 56px); letter-spacing: 0.14em; }
            .creator-label, .weirdo, .tagline { font-size: 12px; }
            .enter { width: 164px; height: 48px; letter-spacing: 0.28em; }
        }
        @media (prefers-reduced-motion: reduce) { .enter { animation: none; } }
    </style>
</head>
<body>
    <main class="hero">
        <div class="wash" aria-hidden="true"></div>
        <img class="portrait" src="hintergrund_schnoez_1_large.jpg" alt="SCHNOEZ">
        <div class="shade"></div>
        <div class="content">
            <header>
                <h1 class="brand-name">Schnoez</h1>
                <span class="creator-label">Content Creator</span>
                <span class="weirdo">weirdo</span>
                <span class="tagline">You probably shouldn't be here.</span>
            </header>
            <a class="enter" href="https://schnoez.de" id="enter-btn">Enter</a>
            <footer class="footer">
                @schnoez
                <span class="separator">·</span>
                <a href="/impressum.html" class="impressum-link">Impressum</a>
            </footer>
        </div>
    </main>
    <script>
        window.addEventListener("pageshow", function (event) {
            if (event.persisted) location.reload();
        });
        const portrait = document.querySelector(".portrait");
        let targetX = 0, targetY = 0, currentX = 0, currentY = 0;
        let baseBeta = null, baseGamma = null;
        function tick() {
            currentX += (targetX - currentX) * 0.06;
            currentY += (targetY - currentY) * 0.06;
            portrait.style.transform = `translate3d(${currentX.toFixed(2)}px, ${currentY.toFixed(2)}px, 0)`;
            requestAnimationFrame(tick);
        }
        requestAnimationFrame(tick);
        if (window.matchMedia("(pointer: fine)").matches) {
            window.addEventListener("pointermove", (e) => {
                targetX = ((e.clientX / window.innerWidth) - 0.5) * 12;
                targetY = ((e.clientY / window.innerHeight) - 0.5) * 8;
            });
        } else {
            function onTilt(e) {
                if (baseBeta === null) { baseBeta = e.beta; baseGamma = e.gamma; }
                targetX = Math.max(-10, Math.min(10, (e.gamma - baseGamma) * 0.25));
                targetY = Math.max(-8, Math.min(8, (e.beta - baseBeta) * 0.18));
            }
            function enableTilt() {
                if (typeof DeviceOrientationEvent !== "undefined" && typeof DeviceOrientationEvent.requestPermission === "function") {
                    DeviceOrientationEvent.requestPermission().then((state) => {
                        if (state === "granted") window.addEventListener("deviceorientation", onTilt);
                    }).catch(() => {});
                } else window.addEventListener("deviceorientation", onTilt);
            }
            window.addEventListener("pointerdown", enableTilt, { once: true });
        }
        document.getElementById("enter-btn").addEventListener("click", function () {
            this.textContent = "Loading...";
        });
    </script>
</body>
</html>
